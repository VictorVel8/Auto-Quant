[project]
name = "alpha-factory"
version = "0.1.0"
description = "Personal research system that discovers intraday trading signals for US equities."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.9", "pydantic-settings>=2.5", "polars>=1.10", "pyarrow",
  "typer", "rich", "structlog", "python-ulid", "pyyaml", "numpy",
]

[project.scripts]
af = "alpha_factory.cli:app"

[dependency-groups]
data = ["duckdb", "exchange_calendars", "boto3", "httpx"]
engine = ["lark", "scipy"]
loop = ["openai", "jinja2", "modal", "lightgbm", "matplotlib", "httpx"]
dev = [
  "pytest", "hypothesis", "syrupy", "ruff", "pyright", "pre-commit", "import-linter",
  "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_factory"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# the agent-side packages (never imported by the sealed ones) are mostly SQL, prompts, CLI text
"src/alpha_factory/research/*" = ["E501"]
"src/alpha_factory/agents/*" = ["E501"]
"src/alpha_factory/orchestrator/*" = ["E501"]
"src/alpha_factory/compute/*" = ["E501"]
"src/alpha_factory/cli_research.py" = ["E501"]
"tests/**" = ["E501", "RUF059", "RUF015", "E741", "RUF028"]  # dense assertions and fixtures

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
strict = [
  "src/alpha_factory/contracts",
  "src/alpha_factory/data",
  "src/alpha_factory/sandbox",
  "src/alpha_factory/dsl",
  "src/alpha_factory/eval",
  "src/alpha_factory/backtest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:pandas.*", "ignore:.*Series.values returning.*"]
