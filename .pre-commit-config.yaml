repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
  - repo: local
    hooks:
      - id: data-guard
        name: data guard
        entry: python3 scripts/data_guard.py
        language: system
        pass_filenames: true
        always_run: true
